[package]
name = "shard-sieve"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Stream-validate TAR dataset shards and emit reproducible manifests"
license = "MIT"
repository = "https://github.com/nicholas-ruest/shard-sieve"
readme = "README.md"
keywords = ["webdataset", "tar", "dataset", "validation", "mlops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
lto = "thin"
